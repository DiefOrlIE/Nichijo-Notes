name: Verify DSA guide desktop mobile and tablet
on:
  push:
    paths:
      - ".github/workflows/check-dsa-guide.yml"
      - ".github/scripts/check-dsa.mjs"
      - ".github/scripts/verify-dsa-algorithms.py"
      - "dsa-midterm/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax of all script modules
        id: syntax
        run: |
          for f in dsa-midterm/*.js dsa-midterm/v2/*.js; do node --check "$f"; done
      - name: Compile example code and recompute algorithm answers
        run: python3 .github/scripts/verify-dsa-algorithms.py
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test responsive reader and all interactive functions
        id: smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dsa-server.log 2>&1 &
          sleep 3
          set -o pipefail
          node .github/scripts/check-dsa.mjs 2>&1 | tee dsa-browser-test.log
      - name: Preserve browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsa-browser-smoke-tests
          path: |
            dsa-desktop.png
            dsa-phone.png
            dsa-tablet.png
          if-no-files-found: ignore
      - name: Record verification status in repository
        if: always()
        run: |
          mkdir -p dsa-midterm
          cat > dsa-midterm/verification.json <<'JSON'
          {
            "syntax": "${{ steps.syntax.outcome }}",
            "browser_tests": "${{ steps.smoke.outcome }}",
            "viewports": ["1360x900 desktop", "390x844 phone", "820x1180 tablet"],
            "font": "Wenjin Songti body plus Source Han Serif headings (both local WOFF2)",
            "test_script": ".github/scripts/check-dsa.mjs",
            "chapters": 16,
            "units": 109,
            "reading_mode": "continuous Markdown-first"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dsa-browser-test.log dsa-midterm/verification.log 2>/dev/null || true
          git add dsa-midterm/verification.json dsa-midterm/verification.log
          git commit -m "Record DSA browser validation result" || true
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
