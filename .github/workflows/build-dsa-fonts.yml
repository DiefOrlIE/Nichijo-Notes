name: Build self-hosted DSA serif fonts
on:
  push:
    paths:
      - ".github/workflows/build-dsa-fonts.yml"
      - "dsa-midterm/*.js"
      - "dsa-midterm/index.html"
      - "dsa-midterm/style.css"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  subset-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install open-source fonts and subset tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --user "fonttools[woff]" brotli
      - name: Build local OFL font subsets for DSA lessons
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools import subset
          d=Path('dsa-midterm');dest=d/'fonts';dest.mkdir(exist_ok=True)
          source=''.join(p.read_text(encoding='utf-8') for p in d.glob('*.js'))
          source+=(d/'index.html').read_text(encoding='utf-8')
          source+=(d/'style.css').read_text(encoding='utf-8')
          glyphs=set(source)
          glyphs.update(map(chr,range(32,127)))
          glyphs.update("中文宋体楷书结构算法证明为什么如何写编码理解深度")
          for face,weight in [('Regular','regular'),('Bold','bold')]:
              path=f'/usr/share/fonts/opentype/noto/NotoSerifCJK-{face}.ttc'
              font=TTFont(path,fontNumber=2)
              options=subset.Options()
              options.flavor='woff2'
              options.layout_features=['*']
              options.name_IDs=['*']
              options.name_languages=['*']
              options.notdef_glyph=True
              options.notdef_outline=True
              subsetter=subset.Subsetter(options=options)
              subsetter.populate(unicodes=sorted(ord(x) for x in glyphs))
              subsetter.subset(font)
              font.flavor='woff2'
              out=dest/f'noto-serif-sc-{weight}.woff2'
              font.save(out)
              print(out,out.stat().st_size,'bytes')
          doc=Path('/usr/share/doc/fonts-noto-cjk/copyright')
          if doc.exists():
              (dest/'LICENSE-AND-ATTRIBUTION.txt').write_text(
                  'Source font: Noto Serif CJK SC, based on Source Han Serif.\n'
                  'Licensed under SIL Open Font License 1.1.\n'
                  'This file includes upstream package licensing information.\n\n'
                  +doc.read_text(encoding='utf-8',errors='replace'),encoding='utf-8')
          PY
      - name: Commit font subsets for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dsa-midterm/fonts
          if git diff --cached --quiet; then echo "Font subsets already up to date"; exit 0; fi
          git commit -m "Embed OFL Chinese serif font subsets for DSA"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
