name: Rebuild both embedded DSA serif fonts
on:
  push:
    paths:
      - ".github/workflows/build-dsa-all-fonts.yml"
      - "dsa-midterm/v2/chapters/**"
      - "dsa-midterm/v2/reader.js"
      - "dsa-midterm/appendix.js"
      - "dsa-readable-v3/manuscripts/**"
      - "dsa-readable-v3/style.css"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsa-dual-font-build
  cancel-in-progress: false
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OFL fonts and fonttools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install "fonttools[woff]" brotli
      - name: Download Wenjin font and upstream OFL
        run: |
          mkdir -p dsa-midterm/fonts
          curl -fL --retry 3 -o /tmp/WenJinMinchoP0-Regular.ttf https://raw.githubusercontent.com/takushun-wu/WenJinMincho/main/ttf/WenJinMinchoP0-Regular.ttf
          curl -fL --retry 3 -o dsa-midterm/fonts/WENJIN-LICENSE.txt https://raw.githubusercontent.com/takushun-wu/WenJinMincho/main/LICENSE.md
      - name: Subset separate body and heading faces from complete manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools import subset
          root=Path('dsa-midterm')
          corpus=''.join(p.read_text(encoding='utf-8') for p in (root/'v2'/'chapters').glob('*.md'))
          corpus+=''.join(p.read_text(encoding='utf-8') for p in root.glob('*.js'))
          corpus+=''.join(p.read_text(encoding='utf-8') for p in (root/'v2').glob('*.js'))
          corpus+=(root/'index.html').read_text(encoding='utf-8')
          corpus+=''.join(p.read_text(encoding='utf-8') for p in Path('dsa-readable-v3/manuscripts').glob('*.md'))
          corpus+=Path('dsa-readable-v3/template.html').read_text(encoding='utf-8')
          glyphs={ord(c) for c in corpus}|set(range(32,127))
          glyphs.update(map(ord,'中文宋体算法算法数据结构字符串数组集合散列并查集排序练习答案'))
          out=root/'fonts'
          def subset_woff(font,target):
              opts=subset.Options()
              opts.flavor='woff2'
              opts.layout_features=['*']
              opts.name_IDs=['*']
              opts.name_languages=['*']
              sub=subset.Subsetter(options=opts)
              sub.populate(unicodes=sorted(glyphs))
              sub.subset(font)
              font.flavor='woff2'
              font.save(out/target)
              print(target,(out/target).stat().st_size)
              assert (out/target).stat().st_size>10000
          for face,weight in [('Regular','regular'),('Bold','bold')]:
              src=f'/usr/share/fonts/opentype/noto/NotoSerifCJK-{face}.ttc'
              subset_woff(TTFont(src,fontNumber=2),f'noto-serif-sc-{weight}.woff2')
          body=TTFont('/tmp/WenJinMinchoP0-Regular.ttf')
          assert len(body.getBestCmap())>2000,'invalid Wenjin font'
          subset_woff(body,'wenjin-songti-regular.woff2')
          doc=Path('/usr/share/doc/fonts-noto-cjk/copyright')
          if doc.exists():
              (out/'LICENSE-AND-ATTRIBUTION.txt').write_text('Noto Serif CJK SC / Source Han Serif, SIL OFL 1.1\n'+doc.read_text(encoding='utf8',errors='replace'),encoding='utf8')
          PY
      - name: Commit all font subsets atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dsa-midterm/fonts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh embedded Wenjin Songti and Source Han Serif for full DSA manuscript"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
