name: Verify V4 manuscript stage A
on:
  push:
    branches: [main]
    paths:
      - "dsa-readable-v4/chapters/**"
      - "dsa-readable-v4/review/**"
      - "dsa-readable-v4/quality/stage_a_check.py"
      - "dsa-readable-v4/quality/teaching_check.py"
      - ".github/workflows/verify-dsa-v4-text.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsa-v4-text-freeze
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python and C++ toolchain availability
        run: |
          python3 --version
          g++ --version | head -1
      - name: Independent manuscript inventory and algorithm checks
        run: |
          python3 dsa-readable-v4/quality/teaching_check.py
          python3 dsa-readable-v4/quality/stage_a_check.py
