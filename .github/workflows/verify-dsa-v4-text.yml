name: Verify V4 manuscript stage A
on:
  push:
    paths:
      - "dsa-readable-v4/chapters/**"
      - "dsa-readable-v4/review/**"
      - "dsa-readable-v4/quality/stage_a_check.py"
      - ".github/workflows/verify-dsa-v4-text.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsa-v4-text-freeze
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python and C++ toolchain availability
        run: |
          python3 --version
          g++ --version | head -1
      - name: Independent manuscript inventory and algorithm checks
        run: python3 dsa-readable-v4/quality/stage_a_check.py
      - name: Commit immutable source inventory for stage B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dsa-readable-v4/quality/stage-a-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze V4 text stage A source checksums after C++ algorithm verification"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
