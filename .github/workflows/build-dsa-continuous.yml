name: Build DSA continuous Markdown reader
on:
  push:
    paths:
      - "dsa-midterm/v2/chapters/**"
      - "dsa-midterm/v2/build.mjs"
      - "dsa-midterm/v2/template.html"
      - ".github/workflows/build-dsa-continuous.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsa-reader-markdown-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconcile latest Markdown before compiling
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build-only Markdown renderer
        run: npm install --no-save marked@15.0.12
      - name: Generate one continuous HTML reader from 16 manuscripts
        run: node dsa-midterm/v2/build.mjs
      - name: Check syntax and minimum teaching coverage
        run: |
          node --check dsa-midterm/v2/course-data.js
          node --check dsa-midterm/v2/reader.js
          python3 - <<'PY'
          import json,re,pathlib
          js=pathlib.Path('dsa-midterm/v2/course-data.js').read_text()
          obj=json.loads(js.split('window.NICHIJO_V2=',1)[1].rsplit(';',1)[0])
          assert len(obj)==16
          assert len({s['id'] for c in obj for s in c['sections']})==sum(len(c['sections']) for c in obj)
          assert all(len(c['sections'])>=3 for c in obj)
          assert not re.search(r'data-tier=|四档期中自学讲义',pathlib.Path('dsa-midterm/index.html').read_text())
          print('PASS: ',len(obj),'chapters /',sum(len(c['sections']) for c in obj),'teaching units')
          PY
      - name: Commit generated static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dsa-midterm/index.html dsa-midterm/v2/course-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish generated continuous DSA reader with hash chapter"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
